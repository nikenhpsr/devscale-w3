services:
  db:
    image: postgres:16
    container_name: simple-agent
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: Password_example
      POSTGRES_DB: simple-agent
    ports:
      - "55432:5432"
    volumes:
      - hono_prisma_db:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: redisdb
    ports:
      - "56379:6379"
volumes:
  hono_prisma_db: